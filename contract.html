:root{--bg:#ECEEF0;--fg:#0B0C0D;--ln:rgba(0,0,0,.2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0B0C0D;--fg:#ECEEF0;--ln:rgba(255,255,255,.25)}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.6 Cairo,Tahoma,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}h1{font:600 26px 'El Messiri',serif;margin:6px 0 2px}.mut{opacity:.7;font-size:13px;margin:0 0 12px}
.pv{position:relative;width:100%;aspect-ratio:1240/1754;overflow:hidden;border:1px solid var(--ln);margin:10px 0;background:#fff}.fr{position:absolute;left:0;top:0;width:1240px;height:1754px;transform-origin:0 0;direction:ltr}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}.grid label{display:block;font-size:12px;opacity:.75}.grid input{width:100%;background:transparent;border:1px solid var(--ln);color:var(--fg);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px}

</style></head><body><div class="w"><h1>عقد إلكتروني</h1><p class="mut">عدّل البيانات تحت، والعقد بيتغير قدامك. وقّع بإيدك على الموبايل، وحمّل كل صفحة صورة.</p>

const rdp=(P,e)=>{if(P.length<3)return P;let m=0,k=0;const[a,b]=[P[0],P[P.length-1]],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;for(let i=1;i<P.length-1;i++){const d=Math.abs(dy*P[i][0]-dx*P[i][1]+b[0]*a[1]-b[1]*a[0])/L;if(d>m){m=d;k=i}}return m>e?rdp(P.slice(0,k+1),e).slice(0,-1).concat(rdp(P.slice(k),e)):[a,b]};
